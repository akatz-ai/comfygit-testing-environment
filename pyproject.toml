[project]
name = "comfygit-env-comfygit-workflow-corpus-dev"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "aiohttp>=3.11.8",
    "alembic",
    "av>=14.2.0",
    "blake3",
    "comfy-aimdo==0.2.14",
    "comfy-kitchen>=0.2.8",
    "comfyui-embedded-docs==0.4.4",
    "comfyui-frontend-package==1.42.15",
    "comfyui-workflow-templates==0.9.63",
    "einops",
    "filelock",
    "glfw",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow",
    "psutil",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pyopengl",
    "pyyaml",
    "requests",
    "safetensors>=0.4.2",
    "scipy",
    "sentencepiece",
    "simpleeval>=1.0.0",
    "spandrel",
    "sqlalchemy>=2.0",
    "tokenizers>=0.13.3",
    "torch",
    "torchaudio",
    "torchsde",
    "torchvision",
    "tqdm",
    "transformers>=4.50.3",
    "yarl>=1.18.0",
]

[tool.comfygit]
schema_version = 2
comfyui_version = "v0.20.1"
python_version = "3.11"

[tool.comfygit.nodes.comfygit-manager]
name = "comfygit-manager"
registry_id = "comfygit-manager"
repository = "https://github.com/comfygit-ai/comfygit-manager"
version = "0.0.24"
download_url = "https://cdn.comfy.org/akatz/comfygit-manager/0.0.24/node.zip"
source = "development"
criticality = "optional"

[tool.comfygit.nodes.comfyui-kjnodes]
name = "ComfyUI-KJNodes"
registry_id = "comfyui-kjnodes"
repository = "https://github.com/kijai/ComfyUI-KJNodes"
version = "1.3.9"
download_url = "https://cdn.comfy.org/kijai/comfyui-kjnodes/1.3.9/node.zip"
source = "registry"
criticality = "required"

[tool.comfygit.nodes.rgthree-comfy]
name = "rgthree-comfy"
registry_id = "rgthree-comfy"
repository = "https://github.com/rgthree/rgthree-comfy"
version = "1.0.2604070017"
download_url = "https://cdn.comfy.org/rgthree/rgthree-comfy/1.0.2604070017/node.zip"
source = "registry"
criticality = "required"

[tool.comfygit.nodes.comfyui-akatz-nodes]
name = "ComfyUI-AKatz-Nodes"
registry_id = "comfyui-akatz-nodes"
repository = "https://github.com/akatz-ai/ComfyUI-AKatz-Nodes"
version = "1.11.1"
download_url = "https://cdn.comfy.org/akatz/comfyui-akatz-nodes/1.11.1/node.zip"
source = "registry"
criticality = "required"

[tool.comfygit.workflows."txt2img basic"]
path = "workflows/txt2img basic.json"
nodes = ["comfyui-kjnodes"]

[[tool.comfygit.workflows."txt2img basic".models]]
filename = "v1-5-pruned-emaonly-fp16.safetensors"
category = "checkpoints"
criticality = "flexible"
status = "resolved"
nodes = [{node_id = "4", node_type = "CheckpointLoaderSimple", widget_idx = 0, widget_value = "v1-5-pruned-emaonly-fp16.safetensors"}]
